name: codeventra-static-client-demo
services:
  demo:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    restart: "no"
