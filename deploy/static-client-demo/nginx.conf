pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = / { try_files /index.html =404; }
        location ~ ^/(index|about|services|projects|contact|privacy|terms)\.html$ { try_files $uri =404; }
        location = /robots.txt { try_files $uri =404; }
        location ~ ^/assets/css/(style|components|responsive|about|services|projects|contact)\.css$ { try_files $uri =404; }
        location = /assets/demo.css { try_files $uri =404; }
        location ~ ^/assets/js/(theme|navigation|main)\.js$ { try_files $uri =404; }
        location / { return 404; }
    }
}
