# Proposed production topology. This file is intentionally separate from compose.yaml.
# Supply APP_IMAGE as an immutable registry digest and PRODUCTION_ENV_FILE as a
# protected host-side env file before any operator considers activation.
# DATABASE_URL is supplied independently and must use a dedicated least-privilege
# runtime role, not the PostgreSQL initialization role in POSTGRES_USER.
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the protected environment file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the protected environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the protected environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the protected environment file}
    command:
      - sh
      - -ec
      - exec redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true

  web:
    image: ${APP_IMAGE:?set APP_IMAGE to an approved immutable image digest}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-/etc/codeventra/production.env}
    environment:
      DEPLOYMENT_MODE: production
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the protected environment file}
      REDIS_URL: ${REDIS_URL:?set authenticated REDIS_URL in the protected environment file}
      ENABLE_HTTPS: "True"
      SEO_INDEXING_ENABLED: "False"
      PRODUCTION_PROXY_TRANSPORT: unix
      HSTS_SECONDS: "0"
    user: "10001:10002"
    command: ["gunicorn", "config.wsgi:application", "--config", "deploy/gunicorn.production.py"]
    cap_drop: [ALL]
    volumes:
      - gunicorn_socket:/run/codeventra
      - private_uploads:/app/private_uploads
      - public_media:/app/media
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true

  nginx:
    image: ${NGINX_IMAGE:?set NGINX_IMAGE to the approved custom Nginx image digest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf.example:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - public_media:/srv/media:ro
      - gunicorn_socket:/run/codeventra:ro
    networks:
      - proxy
    depends_on:
      - web
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /run/nginx:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true

volumes:
  gunicorn_socket:
  postgres_data:
  private_uploads:
  public_media:

networks:
  data:
    internal: true
  proxy:
    driver: bridge
