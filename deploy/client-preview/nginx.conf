worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_host $preview_host_ok {
        default 0;
        ~^(localhost|127\.0\.0\.1)(:8765)?$ 1;
        '~^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com$' 1;
    }
    server {
        listen 8080;
        server_name _;
        if ($preview_host_ok = 0) { return 400; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 1k;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        location ~ ^/(services/|about/|projects/|contact/|privacy/|terms/|robots\.txt)?$ {
            include /etc/nginx/preview-proxy.conf;
        }
        location ~ ^/static/(css|js)/[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*\.(css|js)(\.(gz|br))?$ {
            include /etc/nginx/preview-proxy.conf;
        }
        location / { return 404; }
    }
}
