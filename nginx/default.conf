
server {
    listen 80;
    server_name localhost 127.0.0.1;

    client_max_body_size 6M;

    # Docker's internal DNS resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Serve only public media files.
    location /media/ {
        alias /srv/media/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Forward application requests to Django.
    location / {
        # Resolve the Django service using Docker DNS.
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Overwrite client-supplied IP headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
