
<header class="site-header">
    <nav class="container navbar" aria-label="Main navigation">
        <a class="brand" href="{% url 'home' %}" aria-label="TechBullion Hub home">
            <span class="brand-mark" aria-hidden="true">T</span>
            <span class="brand-name">TechBullion <span class="text-gradient">Hub</span></span>
        </a>

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="primary-navigation"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="primary-navigation">
            <a href="{% url 'home' %}" class="nav-link"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Home</a>
            <a href="{% url 'services' %}" class="nav-link"{% if request.resolver_match.url_name == 'services' %} aria-current="page"{% endif %}>Services</a>
            <a href="{% url 'projects:list' %}" class="nav-link"{% if request.resolver_match.namespace == 'projects' %} aria-current="page"{% endif %}>Projects</a>
            <a href="{% url 'blog:list' %}" class="nav-link"{% if request.resolver_match.namespace == "blog" %} aria-current="page"{% endif %}>Blog</a>
            <a href="{% url 'news:list' %}" class="nav-link"{% if request.resolver_match.namespace == "news" %} aria-current="page"{% endif %}>News</a>
            <a href="{% url 'about' %}" class="nav-link"{% if request.resolver_match.url_name == 'about' %} aria-current="page"{% endif %}>About</a>
            <a href="{% url 'contact:contact' %}" class="button button-small button-primary nav-cta"{% if request.resolver_match.namespace == 'contact' %} aria-current="page"{% endif %}>
                Let's Talk <span aria-hidden="true">↗</span>
            </a>

            <button
                class="theme-toggle"
                type="button"
                aria-label="Switch to light theme"
                title="Switch theme"
            >
                <span class="theme-icon" aria-hidden="true">☀</span>
            </button>
        </div>
    </nav>
</header>
