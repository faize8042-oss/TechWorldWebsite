
services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5433:5432"

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: techworld-django:local
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    expose:
      - "8000"

    volumes:
      - ./private_uploads:/app/private_uploads
      - ./media:/app/media

    networks:
      - backend
      - proxy

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/srv/media:ro

    networks:
      proxy:
        ipv4_address: 172.20.0.10

    depends_on:
      - web

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction

    networks:
      - backend

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  backend:
    internal: true

  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
